<title>MGS1 Stage Editor — PSX Build</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e14;color:#aabbcc;font-family:monospace;font-size:11px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#app{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:3px 6px;background:#0d1219;border-bottom:1px solid #1a2535;flex-shrink:0;overflow-x:auto}
.toolbar::-webkit-scrollbar{height:4px}.toolbar::-webkit-scrollbar-track{background:#0a0e14}.toolbar::-webkit-scrollbar-thumb{background:#1a2535}
.title{color:#ff4488;font-weight:bold;font-size:11px;margin-right:6px}.info{color:#446688;font-size:10px;margin-right:4px}.sel{color:#44cc88;font-size:10px;margin-right:4px}.spacer{flex:1}
.sep{color:#1a2535;margin:0 3px;font-size:13px;user-select:none}
.btn{background:#111827;color:#aabbcc;border:1px solid #1a2535;padding:1px 6px;font-size:10px;font-family:monospace;cursor:pointer;border-radius:2px;line-height:16px;white-space:nowrap}
.btn:hover{background:#1a2535;border-color:#334455}.btn.active{background:#1a3a55;border-color:#0088cc;color:#00ccff}.btn.danger{color:#ff4444;border-color:#551111}.btn.danger:hover{background:#331111}.btn.export{color:#ff4488;border-color:#551133}.btn:disabled{opacity:0.4;cursor:default}
.chk{display:flex;align-items:center;gap:2px;font-size:10px;cursor:pointer;color:#aabbcc;white-space:nowrap}.chk input[type=checkbox]{accent-color:#0088cc;width:11px;height:11px}
.ninput{width:52px;background:#0a0e14;color:#aabbcc;border:1px solid #1a2535;padding:1px 3px;font-size:10px;font-family:monospace;border-radius:2px}
.ov{position:absolute;pointer-events:none;font-size:10px;font-family:monospace;z-index:5;padding:2px 4px;background:rgba(10,14,20,0.6);border-radius:2px}
.status{background:#070b10;border-top:1px solid #1a2535;padding:2px 8px;font-size:9px;color:#334;display:flex;gap:12px;flex-wrap:wrap;flex-shrink:0}
.cg{color:#226644}.co{color:#886622}.cr{color:#882222}
.db{background:#0d1219;border:2px dashed #1a2535;border-radius:8px;padding:40px 60px;text-align:center;cursor:pointer;transition:border-color 0.2s}.db:hover{border-color:#334455;background:#111827}.db h1{color:#ff4488;margin-bottom:12px;font-size:18px}.db p{color:#446688}
select{background:#0a0e14;color:#aabbcc;border:1px solid #1a2535;font-size:10px;font-family:monospace}
input[type=number]::-webkit-inner-spin-button{opacity:0.5}input[type=range]{accent-color:#0088cc;vertical-align:middle}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#0a0e14}::-webkit-scrollbar-thumb{background:#1a2535;border-radius:3px}
